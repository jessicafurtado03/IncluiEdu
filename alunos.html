<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>IncluiEdu | Alunos</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="dashboard-header">

    <a href="index.html" class="logo">
        <span>Inclui</span>Edu
    </a>

    <a class="btn" href="dashboard-professor.html">
        Dashboard
    </a>

</header>


<div class="dashboard">

    <aside class="sidebar">

        <a href="dashboard-professor.html">
            🏠 Dashboard
        </a>

        <a class="ativo" href="alunos.html">
            👨‍🎓 Alunos
        </a>

        <a href="atividades.html">
            📝 Atividades
        </a>

        <a href="adaptar-atividade.html">
            🧩 Adaptações
        </a>

        <a href="resultados.html">
            📊 Resultados
        </a>

    </aside>


    <main class="dashboard-content">

        <div class="dashboard-title">

            <div>

                <span>MINHA TURMA</span>

                <h1>
                    Alunos
                </h1>

                <p>
                    Gerencie os perfis pedagógicos
                    dos seus alunos.
                </p>

            </div>

        </div>


        <section class="dashboard-card">

            <div class="card-header">

                <h2>
                    Cadastrar aluno
                </h2>

            </div>


            <form id="formAluno"
                class="form-grid">

                <div>

                    <label>
                        Nome do aluno
                    </label>

                    <input
                        type="text"
                        id="nomeAluno"
                        placeholder="Nome completo"
                        required
                    >

                </div>


                <div>

                    <label>
                        Turma
                    </label>

                    <input
                        type="text"
                        id="turmaAluno"
                        placeholder="Ex.: 5º Ano A"
                        required
                    >

                </div>


                <div class="form-full">

                    <label>
                        Características de aprendizagem
                    </label>

                    <textarea
                        id="caracteristicasAluno"
                        placeholder="Ex.: possui dificuldade com textos longos..."
                        rows="4">
                    </textarea>

                </div>


                <div class="form-full">

                    <label>
                        Recursos que facilitam a aprendizagem
                    </label>

                    <textarea
                        id="recursosAluno"
                        placeholder="Ex.: imagens, instruções curtas..."
                        rows="4">
                    </textarea>

                </div>


                <div class="form-full">

                    <button class="btn"
                        type="submit">

                        Cadastrar aluno

                    </button>

                </div>

            </form>

        </section>


        <section class="dashboard-card">

            <div class="card-header">

                <h2>
                    Meus alunos
                </h2>

            </div>

            <div id="listaAlunos">

            </div>

        </section>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
