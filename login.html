<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>IncluiEdu | Entrar</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="pagina-login">

<div class="login-container">

    <a href="index.html" class="logo">
        <span>Inclui</span>Edu
    </a>

    <div class="login-card">

        <span class="login-label">
            BEM-VINDO DE VOLTA
        </span>

        <h1>
            Entre na sua conta
        </h1>

        <p>
            Acesse sua área do IncluiEdu.
        </p>


        <form id="formLogin">

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="seuemail@email.com"
                required
            >


            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >


            <button class="btn btn-full"
                type="submit">

                Entrar

            </button>

        </form>


        <p id="mensagemLogin"
            class="mensagem">
        </p>


        <div class="login-footer">

            <span>
                Ainda não possui uma conta?
            </span>

            <a href="cadastro.html">
                Criar conta
            </a>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
