<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>IncluiEdu | Cadastro</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="pagina-login">

<div class="login-container">

    <a href="index.html" class="logo">
        <span>Inclui</span>Edu
    </a>

    <div class="login-card">

        <span class="login-label">
            COMEÇAR NO INCLUIEDU
        </span>

        <h1>
            Criar sua conta
        </h1>

        <p>
            Cadastre-se para começar.
        </p>


        <form id="formCadastro">

            <label>
                Nome completo
            </label>

            <input
                type="text"
                id="nomeCadastro"
                placeholder="Seu nome"
                required
            >


            <label>
                E-mail
            </label>

            <input
                type="email"
                id="emailCadastro"
                placeholder="seuemail@email.com"
                required
            >


            <label>
                Senha
            </label>

            <input
                type="password"
                id="senhaCadastro"
                placeholder="Crie uma senha"
                required
            >


            <label>
                Tipo de usuário
            </label>

            <select id="tipoCadastro">

                <option value="professor">
                    Professor
                </option>

                <option value="aluno">
                    Aluno
                </option>

            </select>


            <button
                class="btn btn-full"
                type="submit">

                Criar conta

            </button>

        </form>


        <p id="mensagemCadastro"
            class="mensagem">
        </p>


        <div class="login-footer">

            <span>
                Já possui uma conta?
            </span>

            <a href="login.html">
                Entrar
            </a>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
